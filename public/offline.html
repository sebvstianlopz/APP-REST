<!doctype html>
<html lang="es-PR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antojo PR · Sin conexión</title>
<style>
  :root { --bg:#fbf7f1; --ink:#1d2a2f; --muted:#5b6b70; --brand:#c8410b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11181b; --ink:#eef2f1; --muted:#9fb1b4; --brand:#ff7a45; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; text-align:center; }
  h1 { font-family: Georgia, serif; margin:.5rem 0 .25rem; }
  p { color:var(--muted); margin:.25rem 0; }
  button { margin-top:1.25rem; border:0; border-radius:999px; padding:.7rem 1.4rem; font-weight:600; background:var(--brand); color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icon.svg" width="56" height="56" alt="">
    <h1>Sin conexión</h1>
    <p>Parece que no tienes internet. Intenta otra vez cuando vuelva la señal.</p>
    <p lang="en">You're offline. Try again when you're back online.</p>
    <button onclick="location.reload()">Reintentar · Retry</button>
  </main>
</body>
</html>
